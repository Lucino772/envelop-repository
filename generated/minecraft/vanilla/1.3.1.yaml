name: minecraft/vanilla/1.3.1
config: |
  process:
    command: >-
      java
      -Xmx1024M
      -Xms1024M
      -jar {{ .Jar }}
      nogui
    graceful:
      type: cmd
      timeout: 30
      options:
        cmd: stop

  logging:
    - type: default
      options:
        format: text
        level: 12

  modules:
    - uses: envelop.core
    - uses: envelop.minecraft
depots:
  - name: minecraft/eula
    config:
      os: ['*']
      arch: ['*']
      tags: []
    manifest:
      type: files
      files:
        - filename: eula.txt
          source:
            type: base64
            content: 
              I0J5IGNoYW5naW5nIHRoZSBzZXR0aW5nIGJlbG93IHRvIFRSVUUgeW91IGFyZSBpbmRpY2F0aW5nIHlvdXIgYWdyZWVtZW50IHRvIG91ciBFVUxBIChodHRwczovL2FjY291bnQubW9qYW5nLmNvbS9kb2N1bWVudHMvbWluZWNyYWZ0X2V1bGEpLgpldWxhPXRydWU=
  - name: minecraft/vanilla/1.3.1-windows
    config:
      os:
        - windows
      arch:
        - '*'
      tags: []
    exports:
      jar: '{{.Path }}/server-1.3.1.jar'
    manifest:
      type: files
      files:
        - filename: server-1.3.1.jar
          source:
            type: http
            url: 
              https://launcher.mojang.com/v1/objects/5dda8413c6376e0ff0eccd5817a2ca94954b16df/windows_server.exe
            hash: sha1:5dda8413c6376e0ff0eccd5817a2ca94954b16df
  - name: minecraft/vanilla/1.3.1-linux
    config:
      os:
        - linux
      arch:
        - '*'
      tags: []
    exports:
      jar: '{{.Path }}/server-1.3.1.jar'
    manifest:
      type: files
