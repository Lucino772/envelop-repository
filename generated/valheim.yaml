name: valheim
config: |
  process:
    command: >-
      {{ .Exe }}
      -nographics
      -batchmode
      -name "My server"
      -port 2456
      -world "Dedicated"
      -password "secret"
      -savedir {{ .Save }}
      -public 0
    environment:
      SteamAppId: "892970"
    graceful:
      type: cmd
      timeout: 30
      options:
        cmd: stop

  logging:
    - type: default
      options:
        format: text
        level: 12

  modules:
    - uses: envelop.core
depots:
- name: steam/app/896660
  config:
    os: ['*']
    arch: ['*']
    tags: []
  exports:
    exe: "{{ .Path }}/valheim_server{{ if eq .TargetOs 'windows' }}.exe{{ end }}"
    save: '{{ .Path }}/envelop_world'
  manifest:
    type: steam
    appid: 896660
